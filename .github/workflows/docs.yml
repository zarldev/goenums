name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "internal/doccheck/**"
      - "Makefile"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "internal/doccheck/**"
      - "Makefile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check documentation
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.128.2"
          extended: true

      - name: Build site
        run: >-
          hugo --source docs --destination docs/public --baseURL "${{ steps.pages.outputs.base_url }}/"
          --cleanDestinationDir --minify --gc --panicOnWarning

      - name: Check internal links
        run: go run ./internal/doccheck docs/public /goenums/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public

  deploy:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
