<!doctype html>
<html lang="{{ .Site.Language.LanguageCode }}" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ .Description | default .Site.Params.description }}">
    <title>{{ with .Title }}{{ . }} | {{ end }}{{ .Site.Title }}</title>
    {{ with resources.Get "css/styles.css" | minify | fingerprint }}
      <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">
    {{ end }}
  </head>
  <body>
    <div class="container">
      {{ partial "header.html" . }}
      <div class="page-layout">
        <aside class="sidebar">
          {{ partial "navigation.html" . }}
        </aside>
        <main class="main-content">
          <div class="content">
            {{ block "main" . }}{{ end }}
          </div>
        </main>
      </div>
      {{ partial "footer.html" . }}
    </div>
    {{ with resources.Get "js/theme-toggle.js" | minify | fingerprint }}
      <script defer src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}"></script>
    {{ end }}
  </body>
</html>
