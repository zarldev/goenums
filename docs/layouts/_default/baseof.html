<!doctype html>
<html lang="{{ .Site.Language.Locale }}">  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ .Description | default .Site.Params.description }}">
    <title>{{ with .Title }}{{ . }} | {{ end }}{{ .Site.Title }}</title>
    <meta name="color-scheme" content="light dark">
    <style>
      html { background: #fff; }
      html[data-theme="dark"] { background: #1e1e1e; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) { background: #1e1e1e; }
      }
    </style>
    <script>
      (() => {
        const theme = localStorage.getItem("goenums-theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      })();
    </script>    {{ with resources.Get "css/styles.css" | minify | fingerprint }}
      <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">
    {{ end }}
  </head>
  <body>
    <div class="container">
      {{ partial "header.html" . }}
      <div class="page-layout">
        <aside class="sidebar">
          {{ partial "navigation.html" . }}
        </aside>
        <main class="main-content">
          <div class="content">
            {{ block "main" . }}{{ end }}
          </div>
        </main>
      </div>
      {{ partial "footer.html" . }}
    </div>
    {{ with resources.Get "js/theme-toggle.js" | minify | fingerprint }}
      <script defer src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}"></script>
    {{ end }}
  </body>
</html>
