<header class="header-container">
  <a href="{{ "/" | relURL }}" class="logo">
    <img src="{{ "images/logo.svg" | relURL }}" alt="goenums logo" class="logo-img">
    <span class="title">{{ .Site.Title }}</span>
    <span class="subtitle">{{ .Site.Params.subtitle }}</span>
  </a>
  <div class="header-actions">
    <button class="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme">
      <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path class="sun" d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364-6.364-1.414 1.414M7.05 16.95l-1.414 1.414m12.728 0-1.414-1.414M7.05 7.05 5.636 5.636M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" />
        <path class="moon" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>
    <a href="https://github.com/{{ .Site.Params.repository }}" class="github-link" target="_blank" rel="noreferrer">
      <svg height="24" viewBox="0 0 16 16" width="24" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8a8.01 8.01 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 4.8a7.7 7.7 0 0 1 2.01.27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z" /></svg>
      <span class="sr-only">goenums on GitHub</span>
    </a>
  </div>
</header>
